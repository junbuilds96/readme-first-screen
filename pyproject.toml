[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "readme-first-screen"
version = "0.1.0"
description = "Score whether a stranger can understand a GitHub README first screen in 10 seconds."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "readme-first-screen contributors" }
]
keywords = ["readme", "cli", "github", "open-source", "documentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
readme-first-screen = "readme_first_screen.cli:main"

[project.urls]
Homepage = "https://github.com/junbuilds96/readme-first-screen"
Issues = "https://github.com/junbuilds96/readme-first-screen/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/readme_first_screen"]

[tool.hatch.build.targets.sdist]
include = [
  "/readme_first_screen",
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
